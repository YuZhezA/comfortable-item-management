plugins {
    id 'fabric-loom' version '1.13.6'
}
ext.loader = 'fabric'
ext.minecraftVersion = '1.21.11'
ext.loaderVersion = '0.18.4'
ext.targetJava = 21
apply from: '../../gradle/target.gradle'
dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
}
loom {
    runs {
        client { programArgs '--username', 'ComfortQA' }
        remove server
    }
}
