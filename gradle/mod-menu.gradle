if (loader == 'fabric') {
    def menus = ['1.20.1': '7.2.2', '1.21.1': '11.0.5', '1.21.11': '17.0.1', '26.3': '21.0.1']
    repositories {
        maven {
            url = 'https://maven.terraformersmc.com/releases/'
            content { includeModule('com.terraformersmc', 'modmenu') }
        }
    }
    def configurationName = minecraftVersion == '26.3' ? 'compileOnly' : 'modCompileOnly'
    dependencies.add(configurationName, "com.terraformersmc:modmenu:${menus[minecraftVersion]}") { transitive = false }
}
